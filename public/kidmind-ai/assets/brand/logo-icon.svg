    <g stroke="#6366f1" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M210 250h36m20 0h36"/>
      <path d="M256 226v48"/>
      <circle cx="210" cy="250" r="10" fill="#8b5cf6" stroke="none"/>
      <circle cx="256" cy="250" r="10" fill="#06b6d4" stroke="none"/>
      <circle cx="302" cy="250" r="10" fill="#f97316" stroke="none"/>
      <path d="M256 250v42"/>
      <circle cx="256" cy="292" r="8" fill="#22d3ee" stroke="none"/>
    </g>
    <!-- Graduation cap -->
    <path d="M256 96 132 148l124 52 124-52-124-52z" fill="url(#km-cap)"/>
    <path d="M380 148v58c0 24-56 42-124 42s-124-18-124-42v-58" fill="#f59e0b"/>
    <circle cx="380" cy="148" r="10" fill="#fde68a"/>
