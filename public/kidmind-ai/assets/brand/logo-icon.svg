    <path d="M118 318h24v8h-24z" fill="#a7f3d0" opacity="0.9"/>
    <!-- Brain body -->
    <path d="M256 148c-52 0-94 38-94 86 0 22 8 42 22 56-8 14-12 30-12 46 0 44 36 80 84 80s84-36 84-80c0-16-4-32-12-46 14-14 22-34 22-56 0-48-42-86-94-86z" fill="url(#km-brain)"/>
    <path d="M256 148c-36 0-66 24-78 58 10-6 22-10 36-10 28 0 52 16 64 40 12-24 36-40 64-40 14 0 26 4 36 10-12-34-42-58-78-58z" fill="#bae6fd" opacity="0.55"/>
