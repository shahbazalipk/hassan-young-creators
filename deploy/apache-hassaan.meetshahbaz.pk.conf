# Apache virtual host for Hassan portfolio
# Path on server: /etc/apache2/sites-available/hassaan.meetshahbaz.pk.conf
#
# Enable with:
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo a2ensite hassaan.meetshahbaz.pk.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName hassaan.meetshahbaz.pk

    # After certbot, this can redirect all HTTP -> HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/hassaan-error.log
    CustomLog ${APACHE_LOG_DIR}/hassaan-access.log combined
</VirtualHost>

# Certbot will usually add the *:443 SSL VirtualHost automatically.
# If you need a manual HTTPS stub after certificates exist, use:
#
# <VirtualHost *:443>
#     ServerName hassaan.meetshahbaz.pk
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/hassaan.meetshahbaz.pk/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/hassaan.meetshahbaz.pk/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyPass / http://127.0.0.1:3000/
#     ProxyPassReverse / http://127.0.0.1:3000/
#
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader set X-Forwarded-Host "hassaan.meetshahbaz.pk"
# </VirtualHost>
