# Apache virtual host for Hassan portfolio ONLY
# Path on server: /etc/apache2/sites-available/hassaan.meetshahbaz.pk.conf
#
# Note: this server has a global /api ProxyPass from another vhost file.
# Hassan forces /api to its own Next.js app with a rewrite proxy below.
# Do not edit other projects' Apache sites to fix Hassan.

<VirtualHost *:80>
    ServerName hassaan.meetshahbaz.pk

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /.well-known/acme-challenge/ !

    RewriteEngine On
    RewriteRule ^/api(?:/(.*))?$ http://127.0.0.1:3000/api/$1 [P,L,QSA]

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    ProxyPassReverse /api http://127.0.0.1:3000/api

    ErrorLog ${APACHE_LOG_DIR}/hassaan-error.log
    CustomLog ${APACHE_LOG_DIR}/hassaan-access.log combined

    RewriteCond %{SERVER_NAME} =hassaan.meetshahbaz.pk
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
