# Apache SSL virtual host for Hassan portfolio ONLY
# Path on server: /etc/apache2/sites-available/hassaan.meetshahbaz.pk-le-ssl.conf
#
# RULE: edit this file locally in git, then deploy with ./scripts/deploy-glimzo.sh
# Do NOT edit Apache live on the server by hand.
# Do NOT modify other projects' Apache sites for Hassan fixes.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName hassaan.meetshahbaz.pk

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "hassaan.meetshahbaz.pk"
    AllowEncodedSlashes NoDecode

    ProxyPass /.well-known/acme-challenge/ !

    # Force Hassan's /api to this site's Next.js app (Hassan-only workaround).
    RewriteEngine On
    RewriteRule ^/api(?:/(.*))?$ http://127.0.0.1:3000/api/$1 [P,L,QSA]

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    ProxyPassReverse /api http://127.0.0.1:3000/api

    ErrorLog ${APACHE_LOG_DIR}/hassaan-error.log
    CustomLog ${APACHE_LOG_DIR}/hassaan-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/hassaan.meetshahbaz.pk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hassaan.meetshahbaz.pk/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
