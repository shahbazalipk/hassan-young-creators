services:
  hassan-portfolio:
    build: .
    container_name: hassan-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: "https://hassaan.meetshahbaz.pk"
      DATABASE_URL: "file:/data/prod.db"
      DATA_DIR: "/data"
      SESSION_SECRET: "${SESSION_SECRET}"
      CSRF_SECRET: "${CSRF_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_NAME: "${ADMIN_NAME:-Hassan's Parent}"
      PARENT_CONTACT_EMAIL: "${PARENT_CONTACT_EMAIL}"
    volumes:
      - hassan_data:/data
      - ./public/uploads:/app/public/uploads

volumes:
  hassan_data:
